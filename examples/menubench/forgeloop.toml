# ForgeLoop configuration for github.com/clockwiz3/menubench, kept outside that repository:
#   uv run forgeloop run --repo ../menubench --project-config examples/menubench/forgeloop.toml --ticket ...

[sandbox]
base_image = "python:3.12-slim"
# Locked dependencies from uv.lock, the project itself in editable mode, and bandit for the SAST check.
setup = [
  "pip install --no-cache-dir uv==0.12.3",
  "uv export --frozen --no-hashes --all-groups --no-emit-project -o /tmp/requirements.txt",
  "uv pip install --system --no-cache -r /tmp/requirements.txt",
  "uv pip install --system --no-cache --no-deps -e .",
  "uv pip install --system --no-cache bandit==1.8.6",
]
env = { HOME = "/tmp", MPLCONFIGDIR = "/tmp" }
programs = ["pytest", "python", "ruff"]
memory = "2g"
cpus = "2"

[checks]
# Browser tests need a Playwright Chromium the sandbox does not ship.
tests = ["pytest", "-q", "--tb=short", "-p", "no:cacheprovider", "-m", "not live and not e2e and not render"]
lint = ["ruff", "check", "."]
autofix = ["ruff", "check", "--fix", "--quiet", "."]
# The rest of menubench's CI: a PR that passes these will not be bounced by GitHub Actions.
extra = [["ruff", "format", "--check", "."], ["mypy"]]
sast = true
test_timeout_s = 900

[limits]
max_usd_per_run = 1.0

[deliver]
base = "main"
draft = true
